<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Run & Bike Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            padding: 8px;
            overflow: hidden;
        }
        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        h1 {
            font-size: 1rem;
            color: #38bdf8;
        }
        .gps-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
        }
        .gps-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: #334155;
            color: #fbbf24;
        }
        .gps-badge.active {
            background: #065f46;
            color: #34d399;
        }
        .gps-badge.error {
            background: #7f1d1d;
            color: #f87171;
        }
        .retry-btn {
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .card {
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .card-title {
            font-size: 0.55rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .card-value {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .card.full {
            grid-column: span 2;
        }
        .history-section {
            background: #1e293b;
            border-radius: 8px;
            padding: 6px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            margin: 4px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .history-title {
            font-size: 0.6rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 3px;
            text-align: center;
        }
        .history-list {
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 2px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #334155;
            padding: 5px 8px;
            border-radius: 6px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .big-btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            box-shadow: 0 3px 8px rgba(2, 132, 199, 0.3);
        }
        .big-btn:active {
            transform: scale(0.98);
        }
        .footer-actions {
            display: flex;
            gap: 4px;
        }
        .small-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.7rem;
            border: none;
            border-radius: 6px;
            background: #334155;
            color: #cbd5e1;
            cursor: pointer;
        }
        .small-btn.danger {
            background: rgba(185, 28, 28, 0.2);
            color: #f87171;
            border: 1px solid #7f1d1d;
        }
    </style>
</head>
<body>

    <header>
        <h1>Run & Bike Tracker</h1>
        <div class="gps-container">
            <div class="gps-badge" id="gps-status">Recherche GPS...</div>
            <button class="retry-btn" id="gps-retry-btn" onclick="forceGPS()">⚠️ Relancer le GPS</button>
        </div>
    </header>

    <div class="dashboard">
        <div class="card full" style="padding: 4px;">
            <div class="card-title">Chronomètre Total</div>
            <div class="card-value" id="total-chrono" style="color:#38bdf8; font-size: 1.3rem;">00:00:00</div>
        </div>
        <div class="card">
            <div class="card-title">Distance Totale</div>
            <div class="card-value"><span id="total-distance">0.00</span> <span style="font-size:0.75rem; font-weight:normal;">km</span></div>
        </div>
        <div class="card">
            <div class="card-title">Vitesse</div>
            <div class="card-value"><span id="current-speed">0.0</span> <span style="font-size:0.75rem; font-weight:normal;">km/h</span></div>
        </div>
        <div class="card full" style="background: #172554; border-color: #1e3a8a; padding: 4px;">
            <div class="card-title" id="relais-title" style="color: #93c5fd;">Relais actuel</div>
            <div class="card-value" id="relais-chrono" style="color:#34d399; font-size: 1.2rem;">00:00:00</div>
        </div>
    </div>

    <!-- Historique des relais scrollable -->
    <div class="history-section">
        <div class="history-title">Historique des relais (du plus récent au plus ancien)</div>
        <div class="history-list" id="history-list">
            <div style="color: #64748b; text-align: center; font-size: 0.7rem; margin-top: 5px;">Aucun relais enregistré</div>
        </div>
    </div>

    <div class="btn-container">
        <button class="big-btn" id="btn-toggle" onclick="handleMainAction()">DÉMARRER LA COURSE</button>
        <div class="footer-actions">
            <button class="small-btn" onclick="exportData()">📥 Exporter</button>
            <button class="small-btn danger" onclick="resetAll()">Réinitialiser</button>
        </div>
    </div>

    <script>
        let watchId = null;
        let lastPosition = null;
        let totalDistance = 0;
        let startTime = null;
        let totalTimerInterval = null;

        let isRunning = false;
        let relaisList = [];
        let currentRelaisStartTime = null;
        let currentRelaisStartDistance = 0;
        let relaisTimerInterval = null;

        const gpsStatusEl = document.getElementById('gps-status');
        const gpsRetryBtn = document.getElementById('gps-retry-btn');
        const totalChronoEl = document.getElementById('total-chrono');
        const totalDistanceEl = document.getElementById('total-distance');
        const currentSpeedEl = document.getElementById('current-speed');
        const relaisTitleEl = document.getElementById('relais-title');
        const relaisChronoEl = document.getElementById('relais-chrono');
        const historyListEl = document.getElementById('history-list');
        const toggleBtn = document.getElementById('btn-toggle');

        function formatTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function forceGPS() {
            gpsStatusEl.textContent = "Recherche GPS...";
            gpsStatusEl.className = "gps-badge";
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            startGPS();
        }

        function startGPS() {
            if (!navigator.geolocation) {
                gpsStatusEl.textContent = "GPS non supporté";
                gpsStatusEl.className = "gps-badge error";
                return;
            }

            const options = { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 };

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    gpsStatusEl.textContent = "GPS Connecté (±" + Math.round(position.coords.accuracy) + "m)";
                    gpsStatusEl.className = "gps-badge active";

                    const { latitude, longitude, speed } = position.coords;
                    if (speed !== null && speed >= 0) {
                        currentSpeedEl.textContent = (speed * 3.6).toFixed(1);
                    }

                    const currentPos = { lat: latitude, lon: longitude };
                    if (lastPosition !== null && isRunning) {
                        const distanceMeters = calculateDistance(lastPosition.lat, lastPosition.lon, currentPos.lat, currentPos.lon);
                        if (distanceMeters < 50 && distanceMeters > 0.5) {
                            totalDistance += distanceMeters;
                            totalDistanceEl.textContent = (totalDistance / 1000).toFixed(2);
                        }
                    }
                    lastPosition = currentPos;
                },
                (error) => {
                    gpsStatusEl.textContent = "GPS déconnecté / Erreur";
                    gpsStatusEl.className = "gps-badge error";
                },
                options
            );
        }

        startGPS();

        function handleMainAction() {
            const now = Date.now();

            if (!isRunning) {
                isRunning = true;
                startTime = now;
                currentRelaisStartTime = now;
                currentRelaisStartDistance = totalDistance;

                if (watchId === null) startGPS();

                totalTimerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    totalChronoEl.textContent = formatTime(elapsed);
                }, 1000);

                startRelaisTimer();
                toggleBtn.textContent = "PASSAGE DE RELAIS";
                relaisTitleEl.textContent = "Relais n°1 en cours";
            } else {
                const relaisDurationSec = Math.floor((now - currentRelaisStartTime) / 1000);
                const relaisDistanceKmVal = (totalDistance - currentRelaisStartDistance) / 1000;
                const relaisDistanceKmStr = relaisDistanceKmVal.toFixed(2);
                
                // Calcul de la vitesse moyenne du relais (km/h)
                let relaisSpeed = 0;
                if (relaisDurationSec > 0 && relaisDistanceKmVal > 0) {
                    relaisSpeed = (relaisDistanceKmVal / (relaisDurationSec / 3600)).toFixed(1);
                }

                const finishedRelaisNumber = relaisList.length + 1;
                
                relaisList.unshift({
                    number: finishedRelaisNumber,
                    duration: formatTime(relaisDurationSec),
                    distance: relaisDistanceKmStr,
                    speed: relaisSpeed
                });

                updateHistoryDisplay();

                currentRelaisStartTime = now;
                currentRelaisStartDistance = totalDistance;
                relaisTitleEl.textContent = `Relais n°${finishedRelaisNumber + 1} en cours`;
                startRelaisTimer();
            }
        }

        function startRelaisTimer() {
            if (relaisTimerInterval) clearInterval(relaisTimerInterval);
            relaisChronoEl.textContent = "00:00:00";
            
            relaisTimerInterval = setInterval(() => {
                const relaisElapsed = Math.floor((Date.now() - currentRelaisStartTime) / 1000);
                relaisChronoEl.textContent = formatTime(relaisElapsed);
            }, 1000);
        }

        function updateHistoryDisplay() {
            historyListEl.innerHTML = "";
            relaisList.forEach(r => {
                const item = document.createElement('div');
                item.className = "history-item";
                item.innerHTML = `<span><strong>R${r.number}</strong> : ⏱️ ${r.duration}</span> <span>📏 ${r.distance}km</span> <span>⚡ ${r.speed}km/h</span>`;
                historyListEl.appendChild(item);
            });
        }

        function exportData() {
            let text = `--- RUN & BIKE RAPPORT ---\n`;
            text += `Chrono Total : ${totalChronoEl.textContent}\n`;
            text += `Distance Totale : ${totalDistanceEl.textContent} km\n\n`;
            text += `Détail des relais :\n`;
            
            const chronologicalList = [...relaisList].reverse();
            chronologicalList.forEach(r => {
                text += `- Relais n°${r.number} : ${r.duration} | ${r.distance} km | ${r.speed} km/h\n`;
            });

            if (navigator.share) {
                navigator.share({ title: 'Run & Bike', text: text }).catch(() => {});
            } else {
                prompt("Copiez vos résultats :", text);
            }
        }

        function resetAll() {
            if (confirm("Réinitialiser la course ?")) {
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                clearInterval(totalTimerInterval);
                clearInterval(relaisTimerInterval);

                isRunning = false;
                watchId = null;
                relaisList = [];
                totalDistance = 0;
                lastPosition = null;

                totalChronoEl.textContent = "00:00:00";
                totalDistanceEl.textContent = "0.00";
                currentSpeedEl.textContent = "0.0";
                relaisChronoEl.textContent = "00:00:00";
                relaisTitleEl.textContent = "Relais actuel";
                historyListEl.innerHTML = '<div style="color: #64748b; text-align: center; font-size: 0.7rem; margin-top: 5px;">Aucun relais enregistré</div>';
                
                gpsStatusEl.textContent = "Recherche GPS...";
                gpsStatusEl.className = "gps-badge";
                toggleBtn.textContent = "DÉMARRER LA COURSE";
                startGPS();
            }
        }
    </script>
</body>
</html>
