<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Run & Bike Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            padding: 20px;
        }
        header {
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #38bdf8;
        }
        #gps-status {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
            background: #334155;
            color: #fbbf24;
        }
        #gps-status.active {
            background: #065f46;
            color: #34d399;
        }
        #gps-status.error {
            background: #7f1d1d;
            color: #f87171;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 10px 0;
        }
        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-title {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .card-value {
            font-size: 1.8rem;
            font-weight: bold;
        }
        .card.full {
            grid-column: span 2;
        }
        .mode-display {
            background: #334155;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .mode-display.bike {
            background: #0369a1;
            color: #e0f2fe;
        }
        .mode-display.run {
            background: #047857;
            color: #ecfdf5;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .big-btn {
            width: 100%;
            padding: 25px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        .big-btn:active {
            transform: scale(0.97);
        }
        #btn-toggle {
            background: linear-gradient(135deg, #0284c7, #0369a1);
        }
        .secondary-actions {
            display: flex;
            gap: 10px;
        }
        .small-btn {
            flex: 1;
            padding: 12px;
            font-size: 0.9rem;
            border: none;
            border-radius: 8px;
            background: #475569;
            color: white;
            cursor: pointer;
        }
        .small-btn.danger {
            background: #b91c1c;
        }
    </style>
</head>
<body>

    <header>
        <h1>Run & Bike Tracker</h1>
        <div id="gps-status">Recherche GPS...</div>
    </header>

    <div class="mode-display" id="current-mode-label">Mode actuel : En attente</div>

    <div class="dashboard">
        <div class="card full">
            <div class="card-title">Chronomètre Total</div>
            <div class="card-value" id="total-chrono">00:00:00</div>
        </div>
        <div class="card">
            <div class="card-title">Distance Totale</div>
            <div class="card-value"><span id="total-distance">0.00</span> <span style="font-size:1rem;">km</span></div>
        </div>
        <div class="card">
            <div class="card-title">Vitesse Instantanée</div>
            <div class="card-value"><span id="current-speed">0.0</span> <span style="font-size:1rem;">km/h</span></div>
        </div>
        <div class="card">
            <div class="card-title">Temps Vélo</div>
            <div class="card-value" id="bike-chrono" style="font-size:1.4rem; color:#38bdf8;">00:00:00</div>
        </div>
        <div class="card">
            <div class="card-title">Temps Course</div>
            <div class="card-value" id="run-chrono" style="font-size:1.4rem; color:#34d399;">00:00:00</div>
        </div>
    </div>

    <div class="btn-container">
        <button class="big-btn" id="btn-toggle" onclick="toggleMode()">DÉMARRER / CHANGEMENT</button>
        <div class="secondary-actions">
            <button class="small-btn" onclick="forceGPS()">🔄 Relancer GPS</button>
            <button class="small-btn danger" onclick="resetAll()">Réinitialiser</button>
        </div>
    </div>

    <script>
        let watchId = null;
        let lastPosition = null;
        let totalDistance = 0;
        let startTime = null;
        let totalTimerInterval = null;

        let currentMode = 'NONE'; // 'BIKE' ou 'RUN'
        let modeStartTime = null;
        let bikeTimeSeconds = 0;
        let runTimeSeconds = 0;
        let modeTimerInterval = null;

        const gpsStatusEl = document.getElementById('gps-status');
        const modeLabelEl = document.getElementById('current-mode-label');
        const totalChronoEl = document.getElementById('total-chrono');
        const totalDistanceEl = document.getElementById('total-distance');
        const currentSpeedEl = document.getElementById('current-speed');
        const bikeChronoEl = document.getElementById('bike-chrono');
        const runChronoEl = document.getElementById('run-chrono');
        const toggleBtn = document.getElementById('btn-toggle');

        function formatTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Rayon de la terre en mètres
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c; // en mètres
        }

        function forceGPS() {
            gpsStatusEl.textContent = "Recherche GPS forcée...";
            gpsStatusEl.className = "";
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            startGPS();
        }

        function startGPS() {
            if (!navigator.geolocation) {
                gpsStatusEl.textContent = "GPS non supporté";
                gpsStatusEl.className = "error";
                return;
            }

            const options = {
                enableHighAccuracy: true,
                timeout: 30000,
                maximumAge: 0
            };

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    gpsStatusEl.textContent = "GPS Connecté (±" + Math.round(position.coords.accuracy) + "m)";
                    gpsStatusEl.className = "active";

                    const { latitude, longitude, speed } = position.coords;
                    
                    if (speed !== null && speed >= 0) {
                        currentSpeedEl.textContent = (speed * 3.6).toFixed(1);
                    }

                    const currentPos = { lat: latitude, lon: longitude };

                    if (lastPosition !== null) {
                        const distanceMeters = calculateDistance(lastPosition.lat, lastPosition.lon, currentPos.lat, currentPos.lon);
                        // Filtre anti-bruit de saut GPS (< 50m par mise à jour)
                        if (distanceMeters < 50 && distanceMeters > 0.5) {
                            totalDistance += distanceMeters;
                            totalDistanceEl.textContent = (totalDistance / 1000).toFixed(2);
                        }
                    }
                    lastPosition = currentPos;
                },
                (error) => {
                    console.warn(`Erreur GPS (${error.code}): ${error.message}`);
                    gpsStatusEl.textContent = "Erreur GPS : " + error.message;
                    gpsStatusEl.className = "error";
                },
                options
            );
        }

        function toggleMode() {
            const now = Date.now();
            
            if (currentMode === 'NONE') {
                // Premier démarrage
                startTime = now;
                totalTimerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    totalChronoEl.textContent = formatTime(elapsed);
                }, 1000);
                
                startGPS();
                currentMode = 'BIKE'; // On commence par défaut en vélo (ou ajustez selon besoin)
                toggleBtn.textContent = "PASSAGE À LA COURSE À PIED";
            } else if (currentMode === 'BIKE') {
                currentMode = 'RUN';
                toggleBtn.textContent = "PASSAGE AU VÉLO";
            } else {
                currentMode = 'BIKE';
                toggleBtn.textContent = "PASSAGE À LA COURSE À PIED";
            }

            modeStartTime = now;
            updateModeDisplay();

            if (modeTimerInterval) clearInterval(modeTimerInterval);
            modeTimerInterval = setInterval(() => {
                const modeElapsed = Math.floor((Date.now() - modeStartTime) / 1000);
                if (currentMode === 'BIKE') {
                    bikeChronoEl.textContent = formatTime(bikeTimeSeconds + modeElapsed);
                } else if (currentMode === 'RUN') {
                    runChronoEl.textContent = formatTime(runTimeSeconds + modeElapsed);
                }
            }, 1000);
        }

        function updateModeDisplay() {
            modeLabelEl.className = "mode-display " + (currentMode === 'BIKE' ? 'bike' : (currentMode === 'RUN' ? 'run' : ''));
            if (currentMode === 'BIKE') {
                modeLabelEl.textContent = "MODE ACTUEL : 🚴‍♂️ EN VÉLO";
            } else if (currentMode === 'RUN') {
                modeLabelEl.textContent = "MODE ACTUEL : 🏃‍♂️ EN COURSE";
            }
        }

        function resetAll() {
            if (confirm("Voulez-vous tout réinitialiser ?")) {
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                clearInterval(totalTimerInterval);
                clearInterval(modeTimerInterval);

                currentMode = 'NONE';
                totalDistance = 0;
                bikeTimeSeconds = 0;
                runTimeSeconds = 0;

                totalChronoEl.textContent = "00:00:00";
                totalDistanceEl.textContent = "0.00";
                currentSpeedEl.textContent = "0.0";
                bikeChronoEl.textContent = "00:00:00";
                runChronoEl.textContent = "00:00:00";
                gpsStatusEl.textContent = "Recherche GPS...";
                gpsStatusEl.className = "";
                modeLabelEl.className = "mode-display";
                modeLabelEl.textContent = "Mode actuel : En attente";
                toggleBtn.textContent = "DÉMARRER / CHANGEMENT";
            }
        }
    </script>
</body>
</html>
